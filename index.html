 else{dmg*=b.d.dm*(b.cr?.7:1);b.st='hurt';b.atk=null;b.chain++;b.t=Math.max(7,(k=='L'?14:22)-b.chain*1.5);b.vx=a.f*at.kb*(k=='S'?1.3:1);if(k!='L')b.vy=k=='S'?-9:-4;

 ${sb('HP',c.hp/165)}${sb('ATK',c.atk/8)}${sb('SPD',c.spd/4.8)}${sb('DEF',(1.5-c.dm)/.75)}
 </div></div>
 <button class="b" onclick="toAR()">CONFIRM</button>`);
}
function toAR(){S.mode='ar';show(`<h2>CHOOSE ARENA</h2><div class="row">${ARENAS.map((a,i)=>`<div class="cd ar ${i==S.arena?'on':''}" onclick="S.arena=${i};toAR()" style="background:${a.img&&S.urls[a.img]?`url(${S.urls[a.img]}) center/cover`:`linear-gradient(${a.c[0]},${a.c[1]})`}"><b style="text-shadow:0 2px 5px #000;background:#0009;padding:.15em .3em">${a.n}</b></div>`).join('')}</div><div><button class="b" onclick="toCS()">BACK</button><button class="b" onclick="go()">START</button></div>`)}
function go(){A.init();run={ch:CHARS[S.sel],pu:null,t0:performance.now(),st:{dmg:0,maxC:0,sc:0}};S.mode='ar';show(`<div class="pn">${LOAD[R()*LOAD.length|0]}</div>`);setTimeout(()=>beginFight(0),1100)}
function pauseUI(){return`<h1 style="font-size:clamp(24px,6vw,60px)">PAUSED</h1><div><button class="b" onclick="togglePause()">RESUME</button></div><div><button class="b" onclick="beginFight(S.stage)">RESTART FIGHT</button></div><div><button class="b" onclick="show('<div class=&quot;pn&quot;>${CTL.replace(/'/g,'')}</div><button class=&quot;b&quot; onclick=&quot;togglePause();togglePause()&quot;>BACK</button>')">CONTROLS</button></div><div><button class="b" onclick="toMenu()">QUIT TO MENU</button></div>`}
function togglePause(){if(S.mode!='fight')return;S.paused=!S.paused;show(S.paused?pauseUI():'')}
// ===== INPUT =====
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;A.init();const k=e.key.toLowerCase();
 if(k=='escape'){togglePause();return}
 if(S.mode=='cs'){const n=CHARS.length;if(k=='arrowleft')pick((S.sel+n-1)%n);if(k=='arrowright')pick((S.sel+1)%n);if(k=='enter')toAR()}
 const a=KM[k];if(a){if(!K[a])P[a]=1;K[a]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const a=KM[e.key.toLowerCase()];if(a)K[a]=0});
// Draggable movement joystick.
const joy=$('moveJoy'),stick=joy.querySelector('.joycore');
let joyPointer=null;
function resetJoy(){
  K.l=K.r=K.up=K.dn=0;
  stick.style.transform='translate(-50%,-50%)';
  joy.classList.remove('dragging');
}
function moveJoy(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const max=r.width*0.28;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const len=Math.hypot(dx,dy)||1;
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  const nx=dx/max, ny=dy/max;
  K.l=nx<-.25; K.r=nx>.25;
  K.up=ny<-.25; K.dn=ny>.25;
}
joy.onpointerdown=e=>{
  A.init(); joyPointer=e.pointerId; joy.setPointerCapture(e.pointerId);
  joy.classList.add('dragging'); moveJoy(e); e.preventDefault();
};
joy.onpointermove=e=>{if(e.pointerId===joyPointer){moveJoy(e);e.preventDefault()}};
joy.onpointerup=joy.onpointercancel=e=>{
  if(e.pointerId===joyPointer){joyPointer=null;resetJoy();e.preventDefault()}
};

// Attack / power buttons.
document.querySelectorAll('#tc .act').forEach(b=>{
 const a=b.dataset.a;
 b.onpointerdown=e=>{
   A.init();
   if(a==='punch')P.H=1;
   else if(a==='kick')P.L=1;
   else if(a==='power')P.P=1;
   e.preventDefault();
 };
});
addEventListener('blur',()=>{K={}});
toMenu();requestAnimationFrame(loop);
